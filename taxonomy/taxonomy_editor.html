<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraBench-Pro Taxonomy Editor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #070b12;
            color: #e2e8f0;
            font-family: 'DM Mono', 'JetBrains Mono', monospace
        }

        .btn {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            border: 1px solid #1e293b;
            background: #1e293b50;
            color: #94a3b8
        }

        .btn:hover {
            border-color: #334155;
            color: #cbd5e1
        }

        .btn.active {
            border-color: #f59e0b40;
            background: #f59e0b12;
            color: #fcd34d
        }

        .btn.green {
            border-color: #10b98150;
            background: #10b98112;
            color: #6ee7b7
        }

        .btn.purple {
            border-color: #7c3aed40;
            background: #7c3aed12;
            color: #c4b5fd
        }

        .btn.cyan {
            border-color: #06b6d450;
            background: #06b6d412;
            color: #67e8f9
        }

        .tree-row {
            display: flex;
            align-items: center;
            padding: 2px 8px;
            cursor: pointer;
            border-radius: 4px
        }

        .tree-row:hover {
            background: #ffffff05
        }

        .label-row {
            display: flex;
            align-items: center;
            padding: 2px 8px
        }

        .label-row:hover {
            background: #ffffff03
        }

        .badge {
            font-size: 8px;
            font-family: monospace;
            padding: 0 4px;
            border-radius: 3px;
            line-height: 16px
        }

        .badge-dis {
            background: #7f1d1d40;
            border: 1px solid #b91c1c55;
            color: #fca5a5
        }

        .badge-mrg {
            background: #581c8740;
            border: 1px solid #7c3aed55;
            color: #c4b5fd
        }

        .edit-panel {
            position: fixed;
            right: 16px;
            top: 80px;
            width: 480px;
            max-height: calc(100vh - 100px);
            overflow: auto;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px 16px;
            z-index: 100;
            box-shadow: 0 8px 32px #00000080
        }

        .field-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 11px;
            color: #cbd5e1;
            font-family: inherit;
            resize: vertical;
            outline: none
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b40;
            border: 1px solid #1e293b;
            border-radius: 5px;
            padding: 3px 8px
        }

        #json-editor {
            flex: 1;
            resize: none;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 10px;
            line-height: 1.45;
            color: #7b8fb5;
            font-family: 'DM Mono', 'JetBrains Mono', monospace;
            tab-size: 2
        }

        .divider {
            width: 6px;
            cursor: col-resize;
            background: #1e293b;
            flex-shrink: 0;
            position: relative;
            z-index: 5
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 1px;
            width: 4px;
            height: 32px;
            border-radius: 2px;
            background: #334155;
            transform: translateY(-50%)
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px
        }

        .loading-screen h2 {
            font-family: 'DM Sans', sans-serif;
            color: #fcd34d;
            font-size: 18px
        }

        .loading-screen p {
            color: #475569;
            font-size: 12px
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #1e293b;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin .8s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 12px;
            padding: 40px;
            text-align: center
        }

        .error-screen h2 {
            font-family: 'DM Sans', sans-serif;
            color: #f87171;
            font-size: 16px
        }

        .error-screen pre {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 11px;
            color: #94a3b8;
            max-width: 600px;
            overflow-x: auto;
            text-align: left
        }

        .error-screen .hint {
            color: #475569;
            font-size: 11px;
            max-width: 500px;
            line-height: 1.6
        }

        .tut-md {
            font-size: 12px;
            line-height: 1.65;
            color: #94a3b8;
            font-family: 'DM Sans', sans-serif
        }

        .tut-md h1 {
            font-size: 15px;
            font-weight: 700;
            color: #fcd34d;
            margin: 0 0 8px 0;
            font-family: 'DM Sans', sans-serif
        }

        .tut-md p {
            margin: 0 0 8px 0
        }

        .tut-md strong {
            color: #e2e8f0;
            font-weight: 600
        }

        .tut-md em {
            color: #b8c5d8;
            font-style: italic
        }

        .tut-md a {
            color: #60a5fa;
            text-decoration: underline;
            cursor: pointer
        }

        .tut-md a:hover {
            color: #93bbfc
        }

        .tut-md .tax-link {
            color: #fbbf24;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font: inherit;
            padding: 0
        }

        .tut-md .tax-link:hover {
            color: #fde68a
        }

        .tut-md ul {
            margin: 4px 0 8px 0;
            padding-left: 18px
        }

        .tut-md li {
            margin: 2px 0;
            color: #64748b
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        async function loadTaxonomyFiles() {
            const result = { datasets: {}, errors: [] };
            let files = null;
            try { const r = await fetch('/manifest'); if (r.ok) files = await r.json() } catch (e) { }
            if (files && Array.isArray(files)) {
                for (const f of files) {
                    try {
                        const r = await fetch('./' + f); if (!r.ok) continue; const d = await r.json(); if (!d.properties) continue;
                        let name = f.replace('taxonomy_', '').replace('.json', '');
                        if (name === 'v1_original') name = 'V1 Original';
                        else name = name.toUpperCase();
                        result.datasets[name] = d
                    } catch (e) { result.errors.push(f + ': ' + e.message) }
                }
            } else {
                const fallback = ['taxonomy_v1_original.json', 'taxonomy_v2.json'];
                for (const f of fallback) {
                    try {
                        const r = await fetch('./' + f); if (!r.ok) continue; const d = await r.json(); if (!d.properties) continue;
                        const name = f === 'taxonomy_v1_original.json' ? 'V1 Original' : 'V2';
                        result.datasets[name] = d
                    } catch (e) { }
                }
            }
            return result
        }
        async function saveToServer(filename, data) {
            try {
                const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filename, data }) });
                if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json()
            }
            catch (e) { return { ok: false, error: e.message } }
        }
